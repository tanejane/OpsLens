services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    container_name: opslens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opslens}
      POSTGRES_USER: ${POSTGRES_USER:-opslens_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opslens_local_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - opslens_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opslens_admin} -d ${POSTGRES_DB:-opslens}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  opslens_pgdata:
